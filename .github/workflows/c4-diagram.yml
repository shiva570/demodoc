name: C4 Diagram

on:
  push:
    branches: ["feature/*", "main"]

permissions:
  contents: write

jobs:
  update-diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather C# project structure
        run: |
          # Collect .cs source files (exclude bin/obj/test)
          TREE=$(find . -type f -name "*.cs" \
            | grep -vE "(bin/|obj/|\.Test\.|Test\.cs|\.Designer\.cs)" \
            | head -150 \
            | sort)

          # Collect .csproj / .slnx / .sln project files
          BUILD=$(find . -maxdepth 4 \( -name "*.csproj" -o -name "*.sln" -o -name "*.slnx" \) \
            -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null | head -500)

          # Collect appsettings to reveal inter-service URLs
          SETTINGS=$(find . -name "appsettings*.json" \
            ! -path "*/bin/*" ! -path "*/obj/*" \
            -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null | head -200)

          # Collect Program.cs files (entry points, routes, DI registrations)
          PROGRAMS=$(find . -name "Program.cs" ! -path "*/bin/*" ! -path "*/obj/*" \
            -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null | head -400)

          # Write to temp file to avoid env-var size limits
          cat > /tmp/context.txt <<CONTEXT
          C# Source files:
          $TREE

          Build / project files (dependencies, project references):
          $BUILD

          appsettings (inter-service URLs, external systems):
          $SETTINGS

          Program.cs files (routes, DI, HTTP clients):
          $PROGRAMS
          CONTEXT

      - name: Generate C4 diagram via Azure AI Foundry
        env:
          AZURE_AI_FOUNDRY_TOKEN: ${{ secrets.AZURE_AI_FOUNDRY_TOKEN }}
          AZURE_AI_MODEL: "gpt-5-mini"
          API_URL: "https://testing0121.services.ai.azure.com/openai/v1/responses"
        run: |
          CONTEXT=$(cat /tmp/context.txt)

          PROMPT=$(cat <<'EOF'
          You are a software architect. Analyze the following .NET C# microservices codebase and generate a Mermaid C4Container diagram.

          Rules:
          - Identify each microservice as a Container (use the project/folder name).
          - Identify the API Gateway and show routing arrows to downstream services.
          - Identify databases or in-memory stores referenced per service.
          - Identify external systems (payment gateways, email providers, SMS, etc.).
          - Show all synchronous HTTP calls between services as labeled arrows (e.g. "reserves stock", "processes payment").
          - Use C4Container syntax with ContainerDb for databases and Person for users.
          - Output ONLY the Mermaid code block, nothing else.
          EOF
          )

          FULL_PROMPT="$PROMPT

          Codebase:
          $CONTEXT"

          # Responses API payload (input instead of messages)
          PAYLOAD=$(jq -n \
            --arg model "$AZURE_AI_MODEL" \
            --arg prompt "$FULL_PROMPT" \
            '{
              model: $model,
              input: $prompt,
              max_output_tokens: 2000
            }')

          echo "Calling: $API_URL"
          echo "Model:   $AZURE_AI_MODEL"

          HTTP_STATUS=$(echo "$PAYLOAD" | curl -s -o /tmp/api_response.json -w "%{http_code}" "$API_URL" \
            -H "Authorization: Bearer $AZURE_AI_FOUNDRY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-)

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: API returned HTTP $HTTP_STATUS"
            cat /tmp/api_response.json | jq . 2>/dev/null || cat /tmp/api_response.json
            exit 1
          fi

          RESPONSE=$(cat /tmp/api_response.json)

          # Responses API: output[0].content[0].text
          # Fallback to chat completions format in case endpoint behaves differently
          DIAGRAM=$(echo "$RESPONSE" | jq -r '
            .output[0].content[0].text //
            .output[0].content //
            .choices[0].message.content //
            empty
          ')

          if [ -z "$DIAGRAM" ]; then
            echo "ERROR: No diagram content returned. Response:"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          mkdir -p docs
          cat > docs/c4-diagram.md <<DOC
          # C4 Container Diagram

          > Auto-generated on $(date -u +"%Y-%m-%d %H:%M UTC") from commit \`${{ github.sha }}\`

          $DIAGRAM
          DOC

          echo "Diagram written to docs/c4-diagram.md"
          cat docs/c4-diagram.md

      - name: Commit diagram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/c4-diagram.md
          git diff --cached --quiet || git commit -m "docs: update C4 diagram [skip ci]"
          git push
