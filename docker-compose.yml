version: '3.9'

services:
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__user-cluster__Destinations__primary__Address=http://user-service:8080
      - ReverseProxy__Clusters__product-cluster__Destinations__primary__Address=http://product-service:8080
      - ReverseProxy__Clusters__order-cluster__Destinations__primary__Address=http://order-service:8080
      - ReverseProxy__Clusters__payment-cluster__Destinations__primary__Address=http://payment-service:8080
      - ReverseProxy__Clusters__notification-cluster__Destinations__primary__Address=http://notification-service:8080
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - ecommerce-net

  user-service:
    build:
      context: .
      dockerfile: src/UserService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - ecommerce-net

  product-service:
    build:
      context: .
      dockerfile: src/ProductService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - ecommerce-net

  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__UserService=http://user-service:8080
      - Services__ProductService=http://product-service:8080
      - Services__PaymentService=http://payment-service:8080
      - Services__NotificationService=http://notification-service:8080
    depends_on:
      - user-service
      - product-service
      - payment-service
      - notification-service
    networks:
      - ecommerce-net

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - ecommerce-net

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge
